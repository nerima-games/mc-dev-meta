# The whole point of this repository (plan.md §6 Step 0 item 2).
#
# The 15 game repositories are cloned into repos/ by `pnpm sync` and bound here
# into ONE pnpm workspace. During development, `@nerima-games/*` dependencies
# resolve through `workspace:*` — monorepo-equivalent DX with none of the
# repositories actually being a monorepo.
#
# repos/ is gitignored. What is under version control is repos.json, which pins
# each repository's revision; see docs/manifest.md for why that matters.
#
# NOTE: mc-dev-meta itself is deliberately NOT a workspace package. It is the
# tool that fetches the others, so making it a member would mean bootstrapping
# it from the packages it exists to fetch.
packages:
  - 'repos/*'
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@nerima-games/mc-audio@0.2.7'
  - '@nerima-games/mc-kernel@0.5.1'
  - '@nerima-games/mc-meshing@0.1.5'
  - '@nerima-games/mc-noise@0.3.0'
  - '@nerima-games/mc-physics@0.2.1'
  - '@nerima-games/mc-playground-kit@0.2.0'
  - '@nerima-games/mc-render@0.3.0'
  - '@nerima-games/mc-save@0.3.0'
  - '@nerima-games/mc-sim@0.2.1'
  - '@nerima-games/mc-worldgen@0.2.0'
  - '@nerima-games/mx-gameplay@0.3.3'
  - '@nerima-games/mx-multiplayer@0.5.1'
  - '@nerima-games/mx-redstone@0.2.8'
  - '@nerima-games/mx-ui@0.3.9'
