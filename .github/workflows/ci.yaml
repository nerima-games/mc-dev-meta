name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          # pnpm-lock.yaml is gitignored — see .gitignore for why a
          # workspace-root lockfile describing gitignored packages is not a
          # committable artefact. The pnpm store cache therefore keys on
          # package.json; without this input setup-node looks for a lockfile,
          # finds none, and fails the step.
          cache-dependency-path: package.json

      - name: Install dependencies
        # --ignore-scripts: pnpm runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script. This is the
        # check that actually protects the runner, and it is unaffected by the
        # line below.
        #
        # No --frozen-lockfile: there is no committed lockfile to be frozen
        # against. The honest cost is that a CI run resolves devDependencies
        # afresh, so a bad release inside the caret ranges in package.json can
        # turn this workflow red on a day nothing here changed. That is a real
        # cost and it is accepted deliberately: the alternative was committing a
        # file that is dirty on every developer's machine by construction. If
        # this floats often enough to be annoying, pin the six devDependencies
        # to exact versions in package.json — that is the fix, not un-ignoring
        # the lockfile.
        run: pnpm install --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Hard gate. Unlike the reference repository's check-package-dag.ts this
      # script exits non-zero on any violation: unlisted cross-repo import,
      # undeclared dependency, transitive-closure import, a runtime dependency
      # on mc-playground-kit, or a raw wall-clock read (Date.now()).
      - name: Dependency whitelist / time-source ban
        run: pnpm check:deps

      # The API lock (plan.md §6 Step 0-3). Fails when the committed
      # api-lock.md no longer matches the package's public surface, so a change
      # to what consumers can see cannot land without a reviewable diff. Run
      # `pnpm api:update` to refresh it.
      - name: API lock
        run: pnpm api:check

      - name: Test
        run: pnpm test

      # The workspace tooling must work with an EMPTY repos/ — which is exactly
      # what CI has, because repos/ is gitignored. If this step ever needed the
      # other 15 repositories, the tool that fetches them would be the last
      # thing to become trustworthy. See docs/responsibility.md §5.
      - name: Workspace check on an empty repos/
        run: pnpm check:workspace

      - name: Sync plan on an empty repos/ (dry run — touches nothing)
        run: pnpm sync:dry

      # Coverage is reported but not yet thresholded — see vitest.config.ts.
      # The 99% gate is added when this repository reaches its completion criteria.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
