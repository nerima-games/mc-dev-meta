name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # Pinned to a commit, not the mutable v6 tag: a tag is a mutable
        # reference the upstream owner can repoint at any time, so trusting
        # `@v6` means trusting whatever it happens to point at on the day this
        # runs. See SUPPLY_CHAIN.md "アクションの固定".
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          # pnpm-lock.yaml is gitignored — see .gitignore for why a
          # workspace-root lockfile describing gitignored packages is not a
          # committable artefact. The pnpm store cache therefore keys on
          # package.json; without this input setup-node looks for a lockfile,
          # finds none, and fails the step.
          cache-dependency-path: package.json

      - name: Install dependencies
        # --ignore-scripts prevents dependency lifecycle code from running in a
        # fork PR. Nothing here needs a lifecycle script.
        #
        # No --frozen-lockfile: there is no committed lockfile to be frozen
        # against. Direct devDependencies are exact-pinned in package.json, so
        # only transitive dependencies resolve afresh. The workspace-root lockfile
        # is intentionally ignored because its contents change when repos/ is
        # populated; see .gitignore.
        run: pnpm install --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      # oxlint is provided by the Nix devShell (flake.nix), not a package.json
      # devDependency — see flake.nix's comment on why. Installing Nix just for
      # this one step is the trade-off: one pinned oxlint version instead of
      # each repository independently drifting on its own npm-resolved version.
      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Evaluate Nix flake
        run: nix flake check --no-write-lock-file --no-build --all-systems

      - name: Lint
        run: nix develop --command pnpm lint

      - name: Test
        run: pnpm test

      # The workspace tooling must work with an EMPTY repos/ — which is exactly
      # what CI has, because repos/ is gitignored. If this step ever needed the
      # other 15 repositories, the tool that fetches them would be the last
      # thing to become trustworthy. See docs/responsibility.md §5.
      - name: Workspace check on an empty repos/
        run: pnpm check:workspace

      # The feature catalog belongs to this repository. Missing downstream
      # checkouts are reported as reasoned skips, so this remains useful in CI.
      - name: Feature inventory
        run: pnpm check:features

      # Portable data contracts are compared against checked-out runtime
      # implementations when they are present. An empty repos/ is a reasoned
      # skip, so this remains safe for the meta repository's normal CI checkout.
      - name: Portable contract parity
        run: pnpm check:portable

      - name: Sync plan on an empty repos/ (dry run — touches nothing)
        run: pnpm sync:dry

      # Cross-repository mirror check (docs/architecture.md, src/domain/mirror-contract.ts).
      # SKIPS cleanly on an empty repos/ — a mirroring repository or its source
      # not being cloned is a printed skip, never a failure — so this is safe to
      # run unconditionally in CI. Not part of `pnpm verify`: TEST_STANDARD.md §1
      # keeps `verify` to typecheck/lint/test and asks for checks like this one
      # to be their own CI step instead.
      - name: Mirror check
        run: pnpm check:mirrors

      # Repointing is a separate cross-repository contract: it removes each
      # mirror in a disposable copy and asks the source package to satisfy the
      # resulting imports. Empty repos/ is a valid skip, just like Mirror check.
      - name: Repoint check
        run: pnpm check:repoint

      # 4-metric 100% coverage gate (TEST_STANDARD.md §3), applied org-wide with
      # no staged rollout. Thresholds live in vitest.config.ts; `vitest run
      # --coverage` itself exits non-zero when a metric falls short.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
